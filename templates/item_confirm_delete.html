{% extends 'base.html' %}
{% block title %}Delete Item{% endblock %}
{% block content %}
<h2>Delete "{{ item.title }}"?</h2>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Confirm Delete</button>
    <a href="{% url 'myapp:item_list' %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
