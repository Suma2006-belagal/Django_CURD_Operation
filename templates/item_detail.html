{% extends 'base.html' %}
{% block title %}{{ item.title }}{% endblock %}
{% block content %}
<h2>{{ item.title }}</h2>
<p>{{ item.description }}</p>
<p><small>Created: {{ item.created_at }} | Updated: {{ item.updated_at }}</small></p>
<a href="{% url 'myapp:item_update' item.pk %}" class="btn btn-warning">Edit</a>
<a href="{% url 'myapp:item_list' %}" class="btn btn-secondary">Back</a>
{% endblock %}
