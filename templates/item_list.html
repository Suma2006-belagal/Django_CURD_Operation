{% extends 'base.html' %}
{% block title %}My Items{% endblock %}
{% block content %}
<h2>My Items</h2>
<a href="{% url 'myapp:item_create' %}" class="btn btn-success mb-3">+ Add Item</a>
<table class="table table-bordered">
    <thead>
        <tr><th>Title</th><th>Description</th><th>Actions</th></tr>
    </thead>
    <tbody>
    {% for item in items %}
        <tr>
            <td><a href="{% url 'myapp:item_detail' item.pk %}">{{ item.title }}</a></td>
            <td>{{ item.description|truncatewords:10 }}</td>
            <td>
                <a href="{% url 'myapp:item_update' item.pk %}" class="btn btn-sm btn-warning">Edit</a>
                <a href="{% url 'myapp:item_delete' item.pk %}" class="btn btn-sm btn-danger">Delete</a>
            </td>
        </tr>
    {% empty %}
        <tr><td colspan="3">No items yet.</td></tr>
    {% endfor %}
    </tbody>
</table>
{% endblock %}
